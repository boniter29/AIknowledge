<script id="biz-src" type="text/plain">**今天的主线是把散着的事收进制度里。上午立项会上还在指出各说各话，下午接口人、结项日期、数据复核规则就一件件落了下来，绩效和打标两条线也在同一天收口。**

项目制的会开了一个多小时，分量最重的一句话指向协同方式。每个人都在单点向你汇报，内部之间没有讨论，有海外B2B材料的人也没把立项经验传给其他同学。往上追一层，这是上次周会定的两个方向（项目制、进度透明化）推了两三周之后暴露的卡点，意愿不缺，缺的是接口。下午的行动都是在补这个洞。你让Cris和浮云分头找yaya确认产中接口人，以后涉及产中的会议都要拉上；给富华的供应链诉求定了参与方式，流程简化要落到具体项目里才能看出哪里冗余，全链路梳理可以作为切入；对米酒月中要收口的三项结项（库存刊登、BPS财务闭环、乐歌海外仓）直接点名追问，没提交的卡在哪、新的提交日期是哪天，回一句即可。还问了一句带教计划，一直没听到过反馈。这几件事单独看是杂务，合起来是同一件事，把跨线协作从聊天记录里的口头约定，变成有接口人、有回音的机制。

绩效是另一条制度线。周会专题讲绩效方案变革，之前键盘快走时公司改过一版，今天你亲自打完绩效，把打分导向摊开讲，欢迎大家好来讨论。这条线和项目制出自同一个底层判断，几十个专项铺开之后，奖惩和立项都不能再凭印象。

技术判断上今天有个收敛。数据打标的会先是纠结JUV模型要翻墙、对中文效果未知，最后落在一句共识上，BERT也好、JUV也好、LLM也好，无论走哪条路径，打完标都得人工复核，模型都有过度自信的问题。选型标准因此变得简单，看谁快、看谁便宜，闲鱼五块钱买个账号就能验证一套流程。你在群里补了一句，决策类模型不必绑死JUV，各大厂都推了，谷歌的Gemini Decision 1一次能处理上千道是非题，一百多毫秒出结果还带置信度。成本敏感这个判断贯穿了一整天，下午还在推进Dreamina-seedance从火山切到七牛云，那边有95折，火山的费用确实顶不住。

早上还有一场认知层的争论。技术趋势分享会上有同事读到Fable 5.2，说它的核心突破是审美，未来视觉会分成代码生成和模型生成两条路。另一位同事不认同，认为模型真的理解视觉规律，代码不懂怎么从提示词走到符合常规世界的画面。前一位回得更狠，视觉替代不了代码，代码可以模拟视觉。这个争论今天不会有结论，但它决定后面视频和图片两条技术线的投入怎么分，值得留着观察。

傍晚2000元优秀团队奖金的报销走完流程，珍珠提交的费用报销单，你在审批里评论确认收到。制度线跑通的同一天钱也到账，算是给这一天收了个不错的尾。

<script id="diary-src" type="text/plain">今天过得像在收账，把欠了很久的口头约定一条一条收回来，看谁还没有回音。

早上开会我就说了，每个人都在单点跟我聊，你们内部互相之间倒是讨论一下啊。有立项经验的可以传给别人，有问题的也可以问别人。这话我憋了一两周了，上次周会说要抓项目制和进度透明化，结果大家还是各自来找我说各自的事。散会之后我开始逐个补。Cris和浮云的产中接口人，拉yaya一起组个局；富华那边想做供应链流程简化，我掰开讲，这事得靠具体项目才能看出来哪里冗余，光靠梳理只能看出大概；米酒那三项结项我直接点名要一句回音，月中到了，卡在哪、新日期哪天，说清楚就行。带教计划我也问了一句，说出去的话得有回音。

中午前后有个小插曲挺逗。有同事问我打的是不是CodeX，另一个人问谁老是说扣的叉。我说，要这么物化我吗。群里笑作一团。这种时刻没什么信息量，但一天里如果没有几句这种话，剩下的就全是排期和审批了。

下午一直在处理数据打标。JUV那个模型要翻墙，对中文效果还不确定，我一度觉得麻烦。后来会上达成一个朴素共识，不管用什么模型打标，最后都得人工复核，模型都过度自信。既然都要复核，那就选快和便宜的。闲鱼上五块钱买个账号就能验证，我还在群里提醒大家，决策类模型不用绑死JUV，谷歌都出了专门的决策模型。技术选型这件事，最后往往变成钱和时间的选择。

早上还有场好玩的争论，关于代码画画和模型画画。一个同事说Fable 5.2的核心是审美，另一个说模型才真的懂视觉规律，代码不懂。前者回了句狠的，视觉替代不了代码，代码能模拟视觉。我坐在旁边听，两边其实都没错，只是站在不同的时间尺度上。这种争论没有裁判，就看几个月后哪条路先跑出东西。

傍晚水滴的审批来了，2000块优秀团队奖金。确认收到。写审批的单位是林氏家居。这一年的 AI 大赛最后落成这么一笔钱，算是体面的句号。

晚上收到一条BayHack的十条灵感推送，第一条就是代码笔触画，想学油画没时间练笔的那种。白天刚吵完代码能不能画画，晚上算法就给我推了这个。世界挺会押韵的。
</script>
<script>
function fill(id){
  var raw=document.getElementById(id+'-src').textContent;
  var el=document.getElementById(id);
  raw.split(/\n\n+/).forEach(function(para){
    if(!para.trim())return;
    var p=document.createElement('p');
    p.innerHTML=para.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    el.appendChild(p);
  });
}
fill('biz');fill('diary');
</script>
