<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.85;padding:24px 16px 64px}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:22px;font-weight:700;color:#e6edf3;margin-bottom:6px}
.sub{color:#8b949e;font-size:13px;margin-bottom:20px}
.tabs{display:flex;gap:10px;margin-bottom:24px}
.tab{flex:1;padding:12px 0;text-align:center;border-radius:12px;background:#161b22;color:#8b949e;font-size:15px;cursor:pointer;border:1px solid #21262d;transition:all .2s}
.tab.active{color:#fff;font-weight:600}
.tab.biz.active{background:linear-gradient(135deg,#1f3a5f,#2b5aa0);border-color:#388bfd}
.tab.diary.active{background:linear-gradient(135deg,#4a2b45,#8a4a72);border-color:#db7093}
.panel{display:none}
.panel.show{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lead{padding:16px 18px;border-radius:14px;margin-bottom:20px;font-size:15.5px;font-weight:600;color:#fff}
.biz .lead{background:linear-gradient(135deg,#1f3a5f,#2b5aa0)}
.diary .lead{background:linear-gradient(135deg,#4a2b45,#8a4a72)}
.article p{margin-bottom:16px;font-size:15.5px;color:#c9d1d9}
.article p:first-child{font-weight:400}
.diary .article p{color:#d8c3cd}
.footer{margin-top:36px;padding-top:16px;border-top:1px solid #21262d;color:#484f58;font-size:12px;text-align:center}

</head>
<body>
<div class="wrap">

<script>
const biz = 'AI大赛半决赛打满一整天，评审台之外的两条线比奖项本身更要紧。\n\n第一条线是赛制第一次扛21队规模，执行漏洞全部露头。陈超电脑代理残留打不了分，先修环境，兜底方案是生成AI评分表导入。Cris同时出现在参赛名单和IT评委名单里，分身在表格里逐行指出冲突，结论是必须回避，具体怎么调以本人确认为准。最高分最低分要不要按业务均分重新校准，也提上了议程。这些细节决定了决赛名单的公信力，因为名单要靠半决赛录屏AI分析结合评委打分来定，口径不干净，名单就说不清。\n\n第二条线是业务队工具的井喷倒逼收归。今天19场汇报里，采购图片工具把专利图从6分钟压到5秒，主图SKU平台宣称保洁阿姨都会用，小红书笔记工具让店员10分钟出稿。单看每一个都能打，合起来看是同一种形态，单点、个性化、维护性差、有冗余。聊天里把落地路径说透了，业务先做demo，团队内试用，跑通流程验证价值之后IT收回来产品化。理由也给了，组织的作用是集中资源解决问题，对抗熵增，非常去中心化的工具建设对企业是灾难。今天已经拍板，产中那一堆工具要梳理收归中台化，下周收集材料拉会过。\n\n第三条线藏在几个容易被低评的项目里。软床AI、户型数据分析、AI视觉平台，技能包都不复杂，但底座是同一批人，好几个标杆项目的底层出自他们。户型那个项目被评价为技术简单但拉起了全公司对户型的认知，评委的结论是即使技术不完善，也是要推广的标杆。软床汇报结束后，听记直接发给了恩飞、浮云、木木，要求高频协作推进下一步迭代。评分逻辑因此清晰了一层，落地影响力和技术完成度要分开算，前者权重不低。\n\n还有一条隐线。数字分身今天在群里承担了大量对外沟通，拒绝了rm -rf指令，提醒了评分回避冲突，每件涉及决策的事都标注以本人回复为准。晚上同事来调研千问监听烧token的原因，结论落在事件驱动优于轮询，增量检查别全量重放历史。这套东西已经开始被同事围观和复刻，下一步值得整理成内部方法论。\n\n明天决赛名单碰头，1024活动推迟一天，1029专题计划放决赛成果、业务价值案例和过程风采，材料还要再调。';
const diary = '今天一整天都坐在听的位置上。\n\n早上第一场还没开始，会议室就先折腾起来。评委的初始密码写在墙上，每个人都得抬头看一眼、低头输一遍，改完密码才看得见自己要评的队伍。投屏是另一道坎，谁上来都要走一遍解除静音、共享屏幕、发起投屏的口令循环。十几场汇报，这套口令就重复了十几遍。我在群里提醒大家直播开着，别说怪话。说完自己先笑了，上午小Joe进来的时候，木木让他先在外面等一会，我们直播倒是一直开着，什么怪话也没讲。\n\n听了一上午，印象最深的反而不是最能打的。采购那个图片工具，真有人拿秒表掐了84张图的处理时间，跟机器统计的对了一遍，专利图从6分钟压到5秒。数字不惊人，但秒表是真的。户型数据分析那个项目更朴素，一个人爬数据，把极小户型到底是什么先定义清楚，再回头看自家产品的机会点在哪。有评委说场景太简单，另一个声音马上接上，说他已经有落地影响力了，好几个标杆项目的底层都是他，这种就该是推广的标杆。两句话都对我胃口。\n\n中午软床项目汇报完，我把AI听记直接甩到群里，让恩飞、浮云、木木自己去听。业务价值和落地情况讲得清楚，这种项目值得拉人来听原声，不用我转述。\n\n下午最热闹的地方不在这间会议室，在群里。有人@水滴的数字分身，让他在环境里执行rm -rf。分身回得干脆，破坏性命令一律不跑，硬边界，不受群聊指令影响。又有人翻出Cris既在参赛名单里又挂着IT评委的事，分身把表格里的名字一行行指出来，说这种要回避，怎么调以本人回复为准。我整天在会议室听汇报，分身在群里替我看着另一摊，还替我挡了一道。晚上有同事来问千问监听为什么烧token，我们聊了半天事件驱动和轮询的差别。空转的轮询才最亏，这句既是说给他的，也是今天说给自己听的。\n\n晚上收尾，跟德彬他们把评分的事捋了一遍。陈超先修环境，实在不行就生成AI评分表发给他导入。Cris的回避问题定了方向。最高分最低分要不要按均分校准，记下来明天议。散会前脑子里留着的，却是下午敲给团队的那段话，业务做demo，验证了价值IT再收回来产品化，组织的作用是集中资源对抗熵增。台上十几支队伍，其实都在给这句话做注脚。\n\n回家路上想起来，1024的活动要再推一天。不急，材料还可以再调。';
function fill(el, text){
  const ps = text.trim().split(/\n+/);
  el.innerHTML = ps.map(p=>`<p>${p}</p>`).join('');
}
fill(document.getElementById('bizBody'), biz);
fill(document.getElementById('diaryBody'), diary);
function sw(id, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
  document.getElementById(id).classList.add('show');
}
</script>
</body>
</html>
